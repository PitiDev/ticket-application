# GitLab CI/CD Pipeline for Ticket Management System
# Optimized version based on working example

stages:
  - build
  - test
  - deploy

variables:
  DOCKER_REGISTRY: "devops.laobullionbank.com"
  BACKEND_IMAGE: "piti/ticket-app/backend"
  FRONTEND_IMAGE: "piti/ticket-app/frontend"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: unix:///var/run/docker.sock

# ========================================
# BACKEND JOBS
# ========================================

# Build Backend Docker Image
build:backend:
  stage: build
  image: docker:24
  tags:
    - docker
  before_script:
    - docker info
  script:
    - echo "Building backend Docker image..."
    - cd backend
    - docker build --platform linux/amd64 -t $DOCKER_REGISTRY/$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA -t $DOCKER_REGISTRY/$BACKEND_IMAGE:$CI_COMMIT_REF_SLUG .
    - echo "Backend build completed successfully"
    - docker images | grep $BACKEND_IMAGE || true
    - docker push $DOCKER_REGISTRY/$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_REGISTRY/$BACKEND_IMAGE:$CI_COMMIT_REF_SLUG
  only:
    - main
    - develop
    - branches

# Test Backend
test:backend:
  stage: test
  image: node:18-alpine
  tags:
    - docker
  before_script:
    - echo "Installing backend dependencies..."
    - cd backend
    - npm ci --prefer-offline --no-audit || npm install
  script:
    - echo "Running backend tests..."
    - npm test || echo "No tests configured"
    - echo "Running security audit..."
    - npm audit --production || echo "Security vulnerabilities found"
    - echo "Backend tests completed"
  only:
    - main
    - develop
    - branches
  allow_failure: true

# Test Backend Docker Image
test:backend:docker:
  stage: test
  image: docker:24
  tags:
    - docker
  dependencies:
    - build:backend
  before_script:
    - docker info
  script:
    - echo "Testing backend Docker image..."
    - docker pull $DOCKER_REGISTRY/$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker run --rm $DOCKER_REGISTRY/$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA node --version || echo "Node check complete"
    - echo "Backend Docker test completed"
  only:
    - main
    - develop
  allow_failure: true

# ========================================
# FRONTEND JOBS
# ========================================

# Build Frontend Docker Image
build:frontend:
  stage: build
  image: docker:24
  tags:
    - docker
  before_script:
    - docker info
  script:
    - echo "Building frontend Docker image..."
    - cd frontend
    - docker build --platform linux/amd64 -t $DOCKER_REGISTRY/$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA -t $DOCKER_REGISTRY/$FRONTEND_IMAGE:$CI_COMMIT_REF_SLUG .
    - echo "Frontend build completed successfully"
    - docker images | grep $FRONTEND_IMAGE || true
    - docker push $DOCKER_REGISTRY/$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_REGISTRY/$FRONTEND_IMAGE:$CI_COMMIT_REF_SLUG
  only:
    - main
    - develop
    - branches

# Test Frontend
test:frontend:
  stage: test
  image: node:18-alpine
  tags:
    - docker
  before_script:
    - echo "Installing frontend dependencies..."
    - cd frontend
    - npm ci --prefer-offline --no-audit || npm install
  script:
    - echo "Running frontend tests..."
    - npm test || echo "No tests configured"
    - echo "Running security audit..."
    - npm audit --production || echo "Security vulnerabilities found"
    - echo "Frontend tests completed"
  only:
    - main
    - develop
    - branches
  allow_failure: true

# Test Frontend Docker Image
test:frontend:docker:
  stage: test
  image: docker:24
  tags:
    - docker
  dependencies:
    - build:frontend
  before_script:
    - docker info
  script:
    - echo "Testing frontend Docker image..."
    - docker pull $DOCKER_REGISTRY/$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker run --rm $DOCKER_REGISTRY/$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA node --version || echo "Node check complete"
    - echo "Frontend Docker test completed"
  only:
    - main
    - develop
  allow_failure: true

# ========================================
# DEPLOYMENT JOBS
# ========================================

# Deploy to Staging (develop branch)
deploy:staging:
  stage: deploy
  image: docker:24
  tags:
    - docker
  before_script:
    - docker info
  script:
    - echo "Deploying to staging..."
    # Backend
    - docker pull $DOCKER_REGISTRY/$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker tag $DOCKER_REGISTRY/$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA $DOCKER_REGISTRY/$BACKEND_IMAGE:dev
    - docker push $DOCKER_REGISTRY/$BACKEND_IMAGE:dev
    # Frontend
    - docker pull $DOCKER_REGISTRY/$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker tag $DOCKER_REGISTRY/$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA $DOCKER_REGISTRY/$FRONTEND_IMAGE:dev
    - docker push $DOCKER_REGISTRY/$FRONTEND_IMAGE:dev
    - echo "Successfully deployed to staging"
    - echo "Backend -> $DOCKER_REGISTRY/$BACKEND_IMAGE:dev"
    - echo "Frontend -> $DOCKER_REGISTRY/$FRONTEND_IMAGE:dev"
  environment:
    name: staging
    url: http://ticket.laobullionbank.com
  only:
    - develop
  when: manual

# Deploy to Production (main branch)
deploy:production:
  stage: deploy
  image: docker:24
  tags:
    - docker
  before_script:
    - docker info
  script:
    - echo "Deploying to production..."
    # Backend
    - docker pull $DOCKER_REGISTRY/$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker tag $DOCKER_REGISTRY/$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA $DOCKER_REGISTRY/$BACKEND_IMAGE:latest
    - docker push $DOCKER_REGISTRY/$BACKEND_IMAGE:latest
    # Frontend
    - docker pull $DOCKER_REGISTRY/$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker tag $DOCKER_REGISTRY/$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA $DOCKER_REGISTRY/$FRONTEND_IMAGE:latest
    - docker push $DOCKER_REGISTRY/$FRONTEND_IMAGE:latest
    - echo "Successfully deployed to production"
    - echo "Backend -> $DOCKER_REGISTRY/$BACKEND_IMAGE:latest"
    - echo "Frontend -> $DOCKER_REGISTRY/$FRONTEND_IMAGE:latest"
  environment:
    name: production
    url: http://ticket.laobullionbank.com
  only:
    - main
    - tags
  when: manual

# ========================================
# CLEANUP & MAINTENANCE
# ========================================

# Optional: Cleanup old images
cleanup:
  stage: deploy
  image: docker:24
  tags:
    - docker
  script:
    - echo "Cleaning up old Docker images..."
    - docker image prune -af --filter "until=72h" || true
    - echo "Cleanup completed"
  when: manual
  only:
    - main
    - develop
